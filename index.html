<!doctype html>
<html lang="ko" data-lang="both">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03161c">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="EcoWash: an engineering ethics simulation on microplastics. 공학윤리 시뮬레이션 게임">
<meta property="og:title" content="EcoWash Ethics Game">
<meta property="og:description" content="Can we build a washing machine without microplastics? 미세플라스틱 없는 세탁기를 만들 수 있을까?">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>EcoWash Ethics Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbit&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column like a research vessel's console, sticky gauge HUD on top, microfibres drifting behind. */
:root{
  --abyss:#03161c; --deep:#06222b; --panel:#0a2c36; --panel2:#0d3440; --line:#1d4b55; --line2:#2b6470;
  --ink:#dcf2ef; --mute:#8fbab5; --dim:#5f8c88;
  --teal:#4fd1c5; --gold:#f2c14e; --coral:#ff8a7a; --sky:#86b8ff; --red:#ff6b6b;
  --f-disp:"Orbit","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--abyss);color:var(--ink)}
body{font-family:var(--f-body);font-size:16.5px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 70% at 50% -10%, #0b3a45 0%, var(--deep) 45%, var(--abyss) 100%) fixed;min-height:100%}
#sea{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:540px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.mono{font-family:var(--f-mono)}
b{font-weight:600}

/* language display */
.en,.ko{display:block}
:root[data-lang="both"] .ko{color:var(--mute);font-size:.9em;margin-top:2px}
:root[data-lang="en"] .ko,:root[data-lang="ko"] .en{display:none}
.chip .en,.chip .ko,.gl .en,.gl .ko,.fl .en,.fl .ko,.glist b .en,.glist b .ko{display:inline}
:root[data-lang="both"] .chip .ko,:root[data-lang="both"] .gl .ko,:root[data-lang="both"] .fl .ko,:root[data-lang="both"] .glist b .ko{font-size:inherit;margin:0 0 0 4px;color:inherit;opacity:.75}

/* HUD */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:rgba(3,22,28,.92)}
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:rgba(3,22,28,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.hud-id{display:flex;gap:10px;align-items:baseline;min-width:0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--teal)}
#hud-team{color:var(--mute);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gauges{display:none!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.g{min-width:0}
.gl{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-lang="both"] .gl .ko{display:none}
:root[data-lang="ko"] .gl .ko{display:inline}
.gn{display:flex;align-items:baseline;gap:6px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gv{font-size:17px;font-weight:500;color:var(--ink)}
.gd{font-size:12px;opacity:0}
.gd.up{color:var(--teal)}.gd.down{color:var(--coral)}
.gd.show{animation:pop 2.4s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(4px)}12%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
.gbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:3px}
.gfill{display:block;height:100%;width:50%;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.sw-P{background:var(--gold)}.sw-T{background:var(--coral)}.sw-E{background:var(--teal)}.sw-R{background:var(--sky)}

.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;flex:none}
.seg button{font:500 12px/1 var(--f-mono);color:var(--mute);background:transparent;border:0;padding:7px 9px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--abyss)}
.seg.big{display:flex}.seg.big button{flex:1;font-size:13px;padding:11px 8px}

/* type */
.eyebrow{font-family:var(--f-mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.eyebrow .ko{letter-spacing:.04em;text-transform:none}
.scr-h{display:flex;flex-direction:column;gap:4px;margin:22px 0 14px}
.when{font-family:var(--f-mono);font-size:14.5px;color:var(--mute)}
.when .en,.when .ko{display:inline}
:root[data-lang="both"] .when .ko{font-size:inherit;margin:0;color:var(--dim)}
:root[data-lang="both"] .when .ko::before{content:" \00b7  "}
:root[data-lang="both"] .when .ko{font-size:inherit}
.headline{font-family:var(--f-disp);font-weight:400;font-size:24px;line-height:1.35;margin:6px 0 10px;text-wrap:balance;color:#fff}
:root[data-lang="both"] .headline .ko{font-size:18px;margin-top:6px}
.scene{margin:0 0 16px;max-width:62ch}
:root[data-lang="both"] .scene .ko{margin-top:8px}
.prompt{font-family:var(--f-disp);font-weight:400;font-size:20px;margin:18px 0 10px;color:#fff}

/* title */
.title{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:10px;padding-block:32px}
.brand{font-family:var(--f-mono);font-size:13px;letter-spacing:.3em;color:var(--mute);margin-top:18px}
.title h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(26px,7.4vw,36px);line-height:1.25;margin:0 0 18px;color:#fff;text-wrap:balance}
.title-ko{font-family:var(--f-disp);font-size:16px;color:var(--teal);margin:-8px 0 18px}
.ko-inline{display:block;opacity:.8}
.startform{display:flex;flex-direction:column;gap:10px;background:rgba(10,44,54,.72);border:1px solid var(--line);border-radius:14px;padding:18px}
.lab{font-family:var(--f-mono);font-size:13px;color:var(--mute);letter-spacing:.06em}
.lab .en,.lab .ko{display:inline}.lab .ko{margin-left:6px}
:root[data-lang="both"] .lab .ko{font-size:inherit}
input{font:500 16px var(--f-body);color:var(--ink);background:var(--abyss);border:1px solid var(--line2);border-radius:8px;padding:12px 12px;width:100%;box-sizing:border-box}
input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
input.bad{border-color:var(--coral);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* buttons */
.btn{font:600 16.5px var(--f-body);border-radius:10px;padding:13px 16px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn .en,.btn .ko{display:inline}
:root[data-lang="both"] .btn .ko{font-size:.86em;margin:0 0 0 2px;color:inherit;opacity:.7}
.btn.primary{background:var(--teal);color:var(--abyss);border-color:var(--teal)}
.btn.ghost{color:var(--mute)}
.btn.armed{border-color:var(--coral);color:var(--coral)}
.btn.wide{width:100%;margin-top:18px}
.btn:focus-visible,.opt:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pick{font-family:var(--f-mono)}

/* NPC feed */
.feed{border-left:1px solid var(--line2);padding-left:12px;margin:4px 0 8px;display:flex;flex-direction:column;gap:8px}
.feed-h{font-family:var(--f-mono);font-size:14px;color:var(--dim);display:flex;align-items:center;gap:6px}
.feed-h .en,.feed-h .ko{display:inline}.feed-h .ko{margin-left:4px}
:root[data-lang="both"] .feed-h .ko{font-size:inherit;color:inherit}
.dot{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(79,209,197,.18)}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 12px 3px;padding:8px 11px;font-size:14px;animation:in .45s both;animation-delay:calc(var(--i) * .18s)}
@keyframes in{from{transform:translateY(6px);opacity:.25}to{transform:none;opacity:1}}
.who{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--teal);margin-bottom:2px}
.who .en,.who .ko{display:inline}.who .ko{margin-left:6px}
:root[data-lang="both"] .who .ko{font-size:inherit;color:var(--dim)}

/* options */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:rgba(10,44,54,.82);border:1px solid var(--line);border-radius:12px;padding:13px 13px;color:var(--ink);font:inherit;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--line2)}
.opt[aria-checked="true"]{border-color:var(--teal);background:#0b3a44;box-shadow:inset 3px 0 0 var(--teal)}
.badge{flex:none;min-width:34px;height:28px;padding:0 6px;border-radius:7px;border:1px solid var(--line2);font:500 13px/26px var(--f-mono);text-align:center;color:var(--teal);box-sizing:border-box}
.opt[aria-checked="true"] .badge{background:var(--teal);color:var(--abyss);border-color:var(--teal)}
.ot{min-width:0;display:flex;flex-direction:column;gap:6px}
.otitle{font-weight:600;font-size:17px;color:#fff}
:root[data-lang="both"] .otitle .ko{font-weight:500}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:15px;color:var(--mute)}
.facts li{padding-left:12px;position:relative}
.facts li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:1px;background:var(--teal)}
:root[data-lang="both"] .facts .ko{color:var(--dim)}
.onote{font-size:15px;color:var(--mute)}
:root[data-lang="both"] .onote .ko{color:var(--dim)}
.decide{position:sticky;bottom:0;margin:14px calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,#03161c 82%,rgba(3,22,28,0));padding-top:26px;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.caution{display:flex;gap:12px;align-items:center;margin:4px 0 16px;padding:14px 16px;border:1.5px solid var(--gold);border-radius:12px;background:rgba(242,193,78,.12);font-size:17px;font-weight:600;line-height:1.45;color:#fff}
.caution .en,.caution .ko{display:block}.caution .ko{font-size:17px;color:var(--gold);margin-top:2px}
.cic{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#06222b;font:700 18px/30px Orbit,sans-serif;text-align:center}
.dh{font-size:14px;color:var(--mute);text-align:center}
.decide .btn{width:100%}
.dh .en,.dh .ko{display:inline}.dh .ko{font-size:inherit;margin-left:6px}

/* results, reports */
.tag{display:inline-block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);border:1px solid var(--line2);border-radius:4px;padding:2px 7px}
.tag .en,.tag .ko{display:inline}.tag .ko{margin-left:6px;letter-spacing:0}
:root[data-lang="both"] .tag .ko{font-size:inherit;color:inherit}
.tag.live{color:var(--gold);border-color:rgba(242,193,78,.45)}
.tag.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-right:7px;vertical-align:1px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.result,.report,.panel,.ending{background:rgba(10,44,54,.82);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:20px}
.result{margin-top:24px}
.rbody{margin:0 0 4px}
:root[data-lang="both"] .rbody .ko{margin-top:6px}
.rbody.strong{font-size:18px;color:#fff;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-family:var(--f-mono);font-size:13.5px;border-radius:6px;padding:4px 8px;border:1px solid}
.chip.up{color:var(--teal);border-color:rgba(79,209,197,.4);background:rgba(79,209,197,.08)}
.chip.down{color:var(--coral);border-color:rgba(255,138,122,.4);background:rgba(255,138,122,.08)}
.rep-h{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12px}
.rep-row{font-family:var(--f-mono);font-size:12px;color:var(--dim);margin:12px 0 6px;border-top:1px dashed var(--line2);padding-top:10px}
.rep-row .en,.rep-row .ko{display:inline}.rep-row .ko{margin-left:6px}
:root[data-lang="both"] .rep-row .ko{font-size:inherit}
.ptitle{font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin:0 0 12px}
.ptitle .en,.ptitle .ko{display:inline}.ptitle .ko{margin-left:6px;letter-spacing:0}
:root[data-lang="both"] .ptitle .ko{font-size:inherit;color:var(--dim)}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.glist li{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.glist li>span:last-child{min-width:0}
.glist b{display:block;color:#fff}
.sw{flex:none;width:10px;height:10px;border-radius:2px;margin-top:6px}
.rules{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line);font-size:16px}
.warn{margin:12px 0 0;padding:9px 11px;border-radius:8px;background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.35);color:#ffc1b8;font-size:15.5px}
:root[data-lang="both"] .warn .ko{color:#ffd9d3;opacity:.8}
.hint{font-size:14.5px;color:var(--mute);margin:6px 0 0}
.err{font-size:14.5px;color:var(--coral);margin:4px 0 0}
.err .ko,.hint .ko{font-size:inherit}

/* lock */
.lock{text-align:center;padding:40px 0 10px;display:flex;flex-direction:column;align-items:center;gap:10px}
.screen-ic{width:84px;fill:none;stroke:var(--teal);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.screen-ic .pulse{stroke:var(--gold);stroke-dasharray:60;animation:trace 2.2s linear infinite}
@keyframes trace{from{stroke-dashoffset:60}to{stroke-dashoffset:-60}}
.lock .headline{font-size:24px}
.lock .hint{max-width:34ch}
.codeform{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px;margin-top:14px;text-align:left}
.codeform input{font:500 22px var(--f-mono);letter-spacing:.3em;text-transform:uppercase;text-align:center}

.lock.alert .screen-ic{stroke:var(--coral);animation:alertpulse 1s ease-in-out 3}
.lock.alert .screen-ic .pulse{stroke:var(--coral)}
.lock.alert .tag{color:var(--coral);border-color:rgba(255,138,122,.5)}
@keyframes alertpulse{50%{filter:drop-shadow(0 0 10px rgba(255,138,122,.8));transform:scale(1.06)}}
.hud-ctl{display:flex;gap:8px;align-items:center}
.snd{width:34px;height:30px;border:1px solid var(--line2);border-radius:8px;background:transparent;cursor:pointer;display:grid;place-items:center;padding:0}
.snd svg{width:20px;height:20px;fill:none;stroke:var(--teal);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.snd svg path:first-child{fill:var(--teal)}
.snd .x{display:none}
.snd[aria-pressed="false"] svg{stroke:var(--dim)}.snd[aria-pressed="false"] svg path:first-child{fill:var(--dim)}
.snd[aria-pressed="false"] .w1,.snd[aria-pressed="false"] .w2{display:none}
.snd[aria-pressed="false"] .x{display:inline}
/* hidden meter */
.meter{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:12px;color:var(--sky)}
.mbar{position:relative;flex:1;height:6px;border-radius:3px;background:var(--line)}
.mbar i{position:absolute;inset:0 auto 0 0;background:var(--sky);border-radius:3px}
.mbar em{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--mute)}

/* ending */
.norule{font-size:15.5px;color:var(--mute);margin:0}
.ending{border-color:var(--teal);background:linear-gradient(160deg,rgba(13,52,64,.95),rgba(6,34,43,.95))}
.etype{font-family:var(--f-disp);font-size:28px;line-height:1.25;color:#fff;margin-bottom:12px}
:root[data-lang="both"] .etype .ko{font-size:18px;color:var(--teal);margin-top:4px}
.ending dl{margin:0;display:grid;gap:4px}
.ending dt{font-family:var(--f-mono);font-size:11.5px;color:var(--teal);letter-spacing:.08em;margin-top:10px}
.ending dt .en,.ending dt .ko{display:inline}.ending dt .ko{margin-left:6px}
:root[data-lang="both"] .ending dt .ko{font-size:inherit;color:var(--dim)}
.ending dd{margin:0}
.ending dd.q{font-family:var(--f-disp);font-size:17px;color:#fff}
.finals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fg{display:flex;flex-direction:column;gap:5px;min-width:0}
.fv{font:500 26px var(--f-mono);font-variant-numeric:tabular-nums}
.fbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.fbar i{display:block;height:100%}
.fl{font-size:12px;color:var(--mute)}
:root[data-lang="both"] .fl .ko{display:block;margin:0;font-size:11px}
.pathcode{font:500 clamp(18px,5.4vw,24px) var(--f-mono);color:var(--gold);letter-spacing:.02em;word-break:keep-all}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line2);padding-left:14px}
.tl li{font-size:15.5px;position:relative}
.tl li::before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--teal)}
.tl .mono{display:block;font-size:11px;color:var(--dim);letter-spacing:.06em}
.toppt{margin:22px 0 0;text-align:center;font-family:var(--f-disp);font-size:16px;color:var(--teal)}
:root[data-lang="both"] .toppt .ko{font-size:14px}


/* NPC carousel */
.talk{margin:6px 0 4px}
.talk .feed-h{margin-bottom:4px}
.deck{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.deck::-webkit-scrollbar{display:none}
.npc{flex:0 0 100%;min-width:0;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:14px;padding:14px 2px 4px;box-sizing:border-box}
.avatar{width:116px;height:116px;background:radial-gradient(circle at 50% 40%,#12424e,var(--panel));border:2px solid var(--line2);border-radius:16px;padding:12px;box-sizing:border-box}
.avatar svg{width:100%;height:100%;display:block}
.bubble{position:relative;background:#e6f5f3;color:#0b2a30;border-radius:14px;padding:14px 16px;width:100%;box-sizing:border-box;font-size:17px;line-height:1.55}
.bubble::before{content:"";position:absolute;top:-9px;left:50%;margin-left:-9px;border:9px solid transparent;border-top:0;border-bottom-color:#e6f5f3}
.bubble .who{color:#16776f;margin-bottom:4px}
:root[data-lang="both"] .bubble .who .ko{color:#5d7c79}
:root[data-lang="both"] .bubble .said .ko{color:#4a6664;margin-top:6px}
.deck-nav{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:12px}
.arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--teal);font:500 22px/1 var(--f-mono);cursor:pointer}
.dots{display:flex;gap:7px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line2);cursor:pointer;transition:background .2s,transform .2s}

:root[data-lang="both"] .gc-d .ko{font-size:13px}
.gc-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.gc-bar i{display:block;height:100%;width:50%}
.gc-s{font:500 11px var(--f-mono);color:var(--dim);letter-spacing:.06em}
.rlist{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.rlist li{background:var(--panel2);border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:10px 12px;font-size:16px}

function pickEnding(g) {
  const z = Object.keys(ZSTATS).map(k => [k, (g[k] - ZSTATS[k][0]) / ZSTATS[k][1]]).sort((a, b) => b[1] - a[1]);
  let id;
  if (z[0][1] >= 0.5) id = { P: "strategist", T: "trust", E: "guardian", R: "forecaster" }[z[0][0]];
  else id = g.E < 45 && g.T < 45 ? "holdout" : "balancer";

  function chips(d) {
    return "";
    return `<div class="chips">${GAUGES.map((gg, i) => d[i] ? `<span class="chip ${d[i] > 0 ? "up" : "down"}"><span class="en">${gg.en}</span><span class="ko">${gg.ko}</span> <b>${d[i] > 0 ? "+" : "−"}${Math.abs(d[i])}</b></span>` : "").join("")}</div>`;
  }

  function npcs(list) {
    return `<section class="talk" aria-label="${UI.channel.en}">
      <div class="feed-h"><span class="dot"></span><span>${L(UI.channel)}</span></div>
      <div class="deck" id="deck">
        ${list.map((m, i) => `<article class="npc" aria-label="${i + 1} / ${list.length}">
          <div class="avatar">${sprite(m.who.en)}</div>
          <div class="bubble"><div class="who">${L(m.who)}</div><div class="said">${L(m)}</div></div>
        </article>`).join("")}
      </div>
      <div class="deck-nav">
        <button class="arrow" id="prev" aria-label="${UI.prevMsg.en}">\u2039</button>
        <div class="dots">${list.map((_, i) => `<i data-i="${i}"></i>`).join("")}</div>
        <button class="arrow" id="nextm" aria-label="${UI.nextMsg.en}">\u203a</button>
      </div>
      <p class="hint center">${L(UI.swipe)}</p>
    </section>`;
  }

  function wireDeck(onLast) {
    const deck = document.getElementById("deck"); if (!deck) return;
    const dots = [...main.querySelectorAll(".dots i")], n = dots.length;
    const idx = () => Math.round(deck.scrollLeft / deck.clientWidth);
    const mark = () => { const k = idx(); dots.forEach((d, j) => d.classList.toggle("on", j === k)); if (k === n - 1) onLast(); };
    let last = 0;
    deck.addEventListener("scroll", () => { clearTimeout(deck._t); deck._t = setTimeout(() => { if (idx() !== last) { last = idx(); SOUND.sfx.swipe(); } mark(); }, 60); });
    const to = k => deck.scrollTo({ left: Math.max(0, Math.min(n - 1, k)) * deck.clientWidth, behavior: "smooth" });
    document.getElementById("prev").addEventListener("click", () => to(idx() - 1));
    document.getElementById("nextm").addEventListener("click", () => to(idx() + 1));
    dots.forEach((d, j) => d.addEventListener("click", () => to(j)));
    mark();
  }

  function choiceScreen(cfg) {
    const opts = Object.entries(cfg.options);
    const head = `<header class="scr-h"><div class="eyebrow">${L(cfg.label)}</div><div class="when">${L(cfg.time)}</div></header>`;
    const hasTalk = cfg.npcs && cfg.npcs.filter(Boolean).length > 0;
    if (!S.phase && hasTalk) {
      main.innerHTML = `${head}
        ${cfg.scene ? `<p class="scene">${L(cfg.scene)}</p>` : ""}
        ${npcs(cfg.npcs)}
        <button class="btn wide" id="toopts">${L(UI.toOptions)} \u2192</button>`;
      const b = document.getElementById("toopts");
      wireDeck(() => b.classList.add("primary"));
      b.addEventListener("click", () => setPhase(1));
      return;
    }
    main.innerHTML = `${head}
      <div class="caution" role="note"><span class="cic" aria-hidden="true">!</span><div>${L(UI.decideHint)}</div></div>
      ${!hasTalk && cfg.scene ? `<p class="scene">${L(cfg.scene)}</p>` : ""}
      <h2 class="prompt">${L(cfg.prompt || { en: "What will your group decide?", ko: "여러분 그룹의 결정은?" })}</h2>
      <div class="opts" role="radiogroup">
        ${opts.map(([id, o]) => `
          <button class="opt" role="radio" aria-checked="false" data-id="${id}">
            <span class="badge">${cfg.badge ? cfg.badge(id) : id}</span>
            <span class="ot">
              <span class="otitle">${L(o.title)}</span>
              ${o.facts ? `<ul class="facts">${o.facts.map(f => `<li>${L(f)}</li>`).join("")}</ul>` : ""}
              ${o.note ? `<span class="onote">${L(o.note)}</span>` : ""}
            </span>
          </button>`).join("")}
      </div>
      ${hasTalk ? `<button class="btn ghost small" id="back">\u2190 ${L(UI.backTalk)}</button>` : ""}
      <div class="decide" id="decide">
        <button class="btn primary" id="decide-btn" disabled><span class="pick" id="pick"></span>${L(UI.decide)}</button>
      </div>`;
    const db = document.getElementById("decide-btn");
    main.querySelectorAll(".opt").forEach(b => b.addEventListener("click", () => {
      main.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-checked", "false"));
      b.setAttribute("aria-checked", "true");
      S.sel = b.dataset.id; SOUND.sfx.tap();
      document.getElementById("pick").textContent = (cfg.badge ? cfg.badge(S.sel) : S.sel) + " \u00b7 ";
      db.disabled = false;
    }));
    const bk = document.getElementById("back"); if (bk) bk.addEventListener("click", () => setPhase(0));
    db.addEventListener("click", () => { if (S.sel) { SOUND.sfx.decide(); const snap = JSON.stringify(Object.assign({}, S, { undo: null })); S.undo = snap; cfg.onPick(S.sel); } });
  }

  function resultScreen(o, d, nextLabel, next, extra) {
    main.innerHTML = `
      <article class="result">
        <div class="tag">${L(UI.news)}</div>
        <h2 class="headline">${L(o.head)}</h2>
        ${chips(d)}
        ${extra || ""}
      </article>
      <button class="btn primary wide" id="next">${L(nextLabel)}</button>
      ${S.undo ? `<button class="btn ghost wide" id="undo">\u2190 ${L(UI.undo)}</button>` : ""}`;
    SOUND.sfx.news();
    const ub = document.getElementById("undo");
    if (ub) ub.addEventListener("click", () => { const back = JSON.parse(S.undo); S = Object.assign(fresh(), back); S.phase = 1; S.sel = null; S.undo = null; save(); render(); window.scrollTo(0, 0); });
    document.getElementById("next").addEventListener("click", next);
  }

  function lockScreen(card, next) {
    main.innerHTML = `
      <section class="lock${card === HIDDEN ? " alert" : ""}">
        <svg class="screen-ic" viewBox="0 0 64 48" aria-hidden="true"><rect x="3" y="3" width="58" height="34" rx="3"/><path d="M24 45h16M32 37v8"/><path class="pulse" d="M12 20h8l4-8 6 16 5-12 3 4h14"/></svg>
        <div class="tag">${L(card.lockTitle)}</div>
        <h2 class="headline">${L(UI.look)}</h2>
        <p class="hint">${L(UI.lockHint)}</p>
        <form id="codeform" class="codeform" novalidate>
          <label for="code" class="lab">${L(UI.code)}</label>
          <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="12" inputmode="text">
          <button class="btn primary" type="submit">${L(UI.unlock)}</button>
        </form>
        <p class="err" id="err" hidden>${L(UI.wrong)}</p>
      </section>`;
    const f = document.getElementById("codeform"), inp = document.getElementById("code"), err = document.getElementById("err");
    inp.addEventListener("input", () => { err.hidden = true; inp.classList.remove("bad"); });
    const id = card === HIDDEN ? "H" : "E", btn = f.querySelector("button");
    let busy = false;
    f.addEventListener("submit", async e => {
      e.preventDefault();
      if (busy || Date.now() < (S.lockUntil || 0)) return;
      const code = normCode(inp.value);
      if (!code) return;
      busy = true; btn.disabled = true;
      const ok = await unseal(id, code);
      busy = false; btn.disabled = false;
      if (ok) { S.keys = Object.assign({}, S.keys, { [id]: code }); S.tries = 0; SOUND.sfx.unlock(); next(); }
      else {
        S.tries = (S.tries || 0) + 1;
        if (S.tries >= 5) { S.tries = 0; S.lockUntil = Date.now() + 15000; btn.disabled = true; setTimeout(() => { btn.disabled = false; }, 15000); }
        save();
        SOUND.sfx.wrong(); err.hidden = false; inp.classList.remove("bad"); void inp.offsetWidth; inp.classList.add("bad");
      }
    });
  }

  function hiddenTier() { return HIDDEN.tiers.find(t => S.g.R >= t.min); }

  function ending() { return pickEnding(S.g); }

  function pathCode() {
    const p = [S.s1, S.s2, S.s3 ? S.s1 + circ[S.s3] : null, S.s4 ? circ[S.s4] : null].filter(Boolean);
    return p.join(" → ");
  }

  const go = scr => { if (!/^r\d$/.test(scr)) S.undo = null; S.screen = scr; S.sel = null; S.phase = 0; save(); render(); window.scrollTo(0, 0); };
  const setPhase = p => { S.phase = p; save(); render(); window.scrollTo(0, 0); };

  async function reopen() {
    for (const id of ["E", "H"]) if (S.keys && S.keys[id]) await unseal(id, S.keys[id]);
  }
  function render() {
    if (!opened.E && ["event", "q3", "r3", "lockH", "hidden", "q4", "r4"].includes(S.screen)) S.screen = "lockE";
    if (!opened.H && ["hidden", "q4", "r4"].includes(S.screen)) S.screen = "lockH";
    root.dataset.screen = S.screen;
    drawHud();
    SOUND.setTension(S.screen === "lockE" || S.screen === "lockH" || S.screen === "q4");
    switch (S.screen) {
      case "start": return renderStart();
      case "brief": return renderBrief();
      case "q1": return choiceScreen({ label: STEP1.label, time: STEP1.time, prompt: STEP1.prompt, npcs: STEP1.npcs, options: STEP1.options,
        onPick: id => { S.s1 = id; const o = STEP1.options[id]; apply(o.d); S.hist.push({ tag: "STEP 01 · " + id, head: o.head }); go("r1"); } });
      case "r1": { const o = STEP1.options[S.s1]; return resultScreen(o, o.d, UI.next, () => go("q2")); }
      case "q2": { const c = STEP2[S.s1]; return choiceScreen({ label: STEP2.label, time: STEP2.time, scene: c.scene, npcs: c.npcs, options: c.options,
        onPick: id => { S.s2 = id; const o = c.options[id]; apply(o.d); S.hist.push({ tag: "STEP 02 · " + id, head: o.head }); go("r2"); } }); }
      case "r2": { const o = STEP2[S.s1].options[S.s2]; return resultScreen(o, o.d, UI.next, () => { SOUND.sfx.event(); go("lockE"); }); }
      case "lockE": return lockScreen(EVENT, () => { const r = EVENT.reports[S.s2]; apply([0, r.d, 0, 0]); go("event"); });
      case "event": return renderEvent();
      case "q3": { const c = STEP3[S.s1]; return choiceScreen({ label: STEP3.label, time: STEP3.time, scene: STEP3.scene, npcs: [STEP3.ceo, c.npc].filter(Boolean), options: c.options,
        badge: id => S.s1 + circ[id],
        onPick: id => { S.s3 = id; const o = c.options[id]; apply(o.d); S.hist.push({ tag: "STEP 03 · " + S.s1 + circ[id], head: o.head }); go("r3"); } }); }
      case "r3": { const o = STEP3[S.s1].options[S.s3]; return resultScreen(o, o.d, UI.next, () => { SOUND.sfx.hidden(); go("lockH"); }); }
      case "lockH": return lockScreen(HIDDEN, () => { apply([hiddenTier().d, 0, 0, 0]); S.hTier = hiddenTier().min; go("hidden"); });
      case "hidden": return renderHidden();
      case "q4": return choiceScreen({ label: STEP4.label, time: STEP4.time, scene: STEP4.scene, npcs: STEP4.npcs, options: STEP4.options,
        badge: id => circ[id],
        onPick: id => { S.s4 = id; const o = STEP4.options[id]; const d = o.d(S.g.R); S.d4 = d; apply(d); S.hist.push({ tag: "STEP 04 · " + circ[id], head: o.head }); go("r4"); } });
      case "r4": { const o = STEP4.options[S.s4]; return resultScreen(o, S.d4, UI.seeEnding, () => go("end")); }
      case "end": return renderEnd();
    }
  }

  function renderStart() {
    const saved = load();
    const canResume = saved && saved.screen !== "start" && saved.screen !== "end";
    main.innerHTML = `
      <section class="title">
        <div class="eyebrow">Engineering Ethics \u00b7 Simulation</div>
        <div class="brand">EcoWash</div>
        <h1>${STORY.title.en}</h1>
        <p class="title-ko">${STORY.title.ko}</p>
        <form id="startform" class="startform" novalidate>
          <label class="lab" for="team">Group name</label>
          <input id="team" name="team" maxlength="24" placeholder="${UI.teamPh}" value="${esc(S.team)}" autocomplete="off">
          <p class="err" id="teamerr" hidden>Enter your group name first. <span class="ko-inline">그룹 이름을 먼저 입력하세요.</span></p>
          <div class="lab">Display language</div>
          <div class="seg big" role="group" aria-label="Display language">
            <button type="button" data-setlang="both">EN + 한</button>
            <button type="button" data-setlang="en">EN</button>
            <button type="button" data-setlang="ko">한국어</button>
          </div>
          <button class="btn primary wide" type="submit">Start</button>
          ${canResume ? `<button class="btn ghost wide" type="button" id="resume">Continue <span class="mono">\u00b7 ${esc(saved.team)}</span></button>` : ""}
        </form>
      </section>`;
    main.querySelectorAll("[data-setlang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.setlang)));
    setLang(S.lang);
    const team = document.getElementById("team"), terr = document.getElementById("teamerr");
    team.addEventListener("input", () => { terr.hidden = true; });
    document.getElementById("startform").addEventListener("submit", e => {
      e.preventDefault();
      const v = team.value.trim();
      if (!v) { terr.hidden = false; team.focus(); return; }
      const lang = S.lang; S = fresh(); S.lang = lang; S.team = v; SOUND.startMusic(); go("brief");
    });
    const r = document.getElementById("resume");
    if (r) r.addEventListener("click", () => { S = saved; setLang(S.lang || "both"); SOUND.startMusic(); reopen().then(render); });
  }

  function renderBrief() {
    const head = `<header class="scr-h"><div class="eyebrow">${L(UI.briefTag)}</div><div class="when">D-30</div></header>`;
    {
      main.innerHTML = `${head}
        <h2 class="headline">${L(STORY.title)}</h2>
        <p class="scene">${L(STORY.body)}</p>
        <ul class="rlist">${RULES.map(r => `<li>${L(r)}</li>`).join("")}</ul>
        <button class="btn primary wide" id="next">${L(UI.toStep1)}</button>`;
      document.getElementById("next").addEventListener("click", () => go("q1"));
      return;
    }
    main.innerHTML = `${head}
      <h2 class="headline">${L(UI.gaugesTitle)}</h2>
      <div class="gcards">${GAUGES.map(g => `<div class="gcard"><div class="gc-top"><span class="sw sw-${g.key}"></span><b>${g.en}</b><span class="gc-ko">${g.ko}</span></div><div class="gc-d">${L(g.desc)}</div><div class="gc-bar"><i class="sw-${g.key}"></i></div><div class="gc-s">START 50 / 100</div></div>`).join("")}</div>
      <ul class="rlist">${RULES.map(r => `<li>${L(r)}</li>`).join("")}</ul>
      <button class="btn primary wide" id="next">${L(UI.toStep1)}</button>`;
    document.getElementById("next").addEventListener("click", () => go("q1"));
  }

  function renderEvent() {
    const r = EVENT.reports[S.s2];
    main.innerHTML = `
      <header class="scr-h"><div class="eyebrow">EVENT CARD</div><div class="when">${L(EVENT.time)}</div></header>
      <p class="scene">${L(EVENT.intro)}</p>
      <article class="report">
        <div class="rep-h"><span class="tag">${L(UI.report)}</span><span class="mono">${S.s2}</span></div>
        <div class="rep-row">${L(UI.reportRow)}</div>
        <p class="rbody">${L(r)}</p>
        ${chips([0, r.d, 0, 0])}
      </article>
      <button class="btn primary wide" id="next">${L(UI.toStep3)}</button>`;
    document.getElementById("next").addEventListener("click", () => go("q3"));
  }

  function renderHidden() {
    const t = HIDDEN.tiers.find(x => x.min === S.hTier) || hiddenTier();
    const showA2 = false;
    main.innerHTML = `
      <header class="scr-h"><div class="eyebrow">HIDDEN CARD</div><div class="when">${L(HIDDEN.time)}</div></header>
      <article class="result">
        <div class="tag live">${L(UI.regulation)}</div>
        <p class="rbody strong">${L(HIDDEN.short)}</p>
      </article>
      <section class="panel">
        <h3 class="ptitle">${L(UI.impact)}</h3>
        <p class="rbody">${L(t)}</p>
        ${showA2 ? `<p class="warn">${L(HIDDEN.a2note)}</p>` : ""}
        ${chips([t.d, 0, 0, 0])}
      </section>
      <button class="btn primary wide" id="next">${L(UI.toStep4)}</button>`;
    document.getElementById("next").addEventListener("click", () => go("q4"));
  }

  function renderEnd() {
    const e = ending();
    main.innerHTML = `
      <header class="scr-h"><div class="eyebrow">${L(UI.endTag)}</div><div class="when mono">${esc(S.team)}</div></header>
      <section class="panel pathbox">
        <h3 class="ptitle">${L(UI.path)}</h3>
        <div class="pathcode">${pathCode()}</div>
        <p class="hint">${L(UI.pathHint)}</p>
      </section>
      <section class="panel">
        <h3 class="ptitle">${L(UI.timeline)}</h3>
        <ol class="tl">${S.hist.map(h => `<li><span class="mono">${h.tag}</span>${L(h.head)}</li>`).join("")}</ol>
      </section>
      <p class="toppt">${L(UI.toPPT)}</p>
      <button class="btn ghost wide" id="restart">${L(UI.restart)}</button>`;
    const rb = document.getElementById("restart");
    rb.addEventListener("click", () => {
      if (!rb.dataset.sure) { rb.dataset.sure = 1; rb.innerHTML = L(UI.restartSure); return; }
      const lang = S.lang, team = S.team, snd = S.sound; S = fresh(); S.lang = lang; S.team = team; S.sound = snd;
      save(); render(); window.scrollTo(0, 0);
    });
  }

  /* Hook the HUD gauges */
  document.getElementById("gauges").innerHTML = GAUGES.map(g => `
    <div class="g" id="g-${g.key}"><div class="gl"><span class="en">${g.en}</span><span class="ko">${g.ko}</span></div>
    <div class="gn"><span class="gv">50</span><span class="gd"></span></div><div class="gbar"><i class="gfill sw-${g.key}"></i></div></div>`).join("");

  const saved = load();
  if (saved && saved.screen && saved.screen !== "start") S = Object.assign(fresh(), saved);
  else if (saved) { S.lang = saved.lang || "both"; S.team = saved.team || ""; }
  setLang(S.lang);
  setSound(S.sound !== false);
  reopen().then(render);

  /* Drifting microfibres behind everything */
  const cv = document.getElementById("sea");
  const cx = cv.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, bits;
  function size() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
    bits = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({
      x: Math.random() * W, y: Math.random() * H, l: (4 + Math.random() * 10) * dpr, a: Math.random() * Math.PI,
      v: (0.08 + Math.random() * 0.25) * dpr, s: (Math.random() - 0.5) * 0.004, o: 0.12 + Math.random() * 0.25,
      c: Math.random() < 0.18 ? "242,193,78" : "143,214,206" }));
  }
  function frame() {
    cx.clearRect(0, 0, W, H);
    for (const b of bits) {
      if (!reduce) { b.y -= b.v; b.x += Math.sin(b.y / 140) * 0.2; b.a += b.s; if (b.y < -20) { b.y = H + 20; b.x = Math.random() * W; } }
      cx.strokeStyle = `rgba(${b.c},${b.o})`; cx.lineWidth = 1.2;
      cx.beginPath(); cx.moveTo(b.x, b.y);
      cx.quadraticCurveTo(b.x + Math.cos(b.a) * b.l * 0.6, b.y + Math.sin(b.a + 1) * b.l * 0.6, b.x + Math.cos(b.a) * b.l, b.y + Math.sin(b.a) * b.l);
      cx.stroke();
    }
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); frame();
  addEventListener("resize", () => { size(); if (reduce) frame(); });
})();

</script>
</body>
</html>
